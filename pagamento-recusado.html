<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pagamento não concluído — NARROWBORNE</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:#f4f4f0;font-family:Arial,Helvetica,sans-serif}
    body{min-height:100vh;display:grid;place-items:center;padding:28px}
    .box{width:min(680px,100%);border:1px solid #202020;background:#090909;border-radius:18px;padding:42px;text-align:center}
    .eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#777;margin:0 0 18px}
    h1{font-family:Impact,'Arial Narrow',Arial,sans-serif;font-size:clamp(54px,9vw,92px);line-height:.9;margin:0 0 24px}
    p{color:#aaa;line-height:1.7;margin:0 auto 28px;max-width:520px}
    a{display:inline-flex;min-height:50px;padding:0 22px;align-items:center;justify-content:center;background:#f2f2ee;color:#080808;text-decoration:none;border-radius:9px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
  </style>
</head>
<body>
  <main class="box">
    <p class="eyebrow">NARROWBORNE · CHECKOUT</p>
    <h1>PAGAMENTO NÃO CONCLUÍDO.</h1>
    <p>O pagamento não foi concluído. Seu carrinho continua salvo para você tentar novamente.</p>
    <a href="index.html">Voltar para a loja</a>
  </main>
  <script></script>
</body>
</html>
